services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-project-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./vectorstore:/app/vectorstore
